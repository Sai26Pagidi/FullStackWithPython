<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Fundamentals</title>
    </head>
    <body>
        <!--JavaScript programs can be inserted almost anywhere into an HTML document using the <script> tag.-->
            <p>Before alert</p>
            <script>
                alert("Hello World!");
            </script>
            <p>After alert</p>
    </body>
</html>
