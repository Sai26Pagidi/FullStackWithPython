<!DOCTYPE html>
<html>

<body>
    <script>
        //we use let keyword to create variable in javascript
        let name = "sai";
        alert("Hello " + name);
        // we can also declare variable in one line like below
        let user = 'John', age = 25, message = 'Hello';
        alert(message + " " + user + " " + "Your age is: " + age);

        let msg = "Hello";
        let que = "world";
        alert(msg + " " + que);

        let msg1 = "Hello World!";
        let que1;
        que1 = msg1; //variable should be declared once, repetetion of let cause an error for same variable
        alert("msg1:" + msg1 + " que1:" + que1);

        // Constants -to declare a constant variable use const instead of let
        // Variables declared using const are called “constants”. 
        // They cannot be reassigned. An attempt to do so would cause an error:
        const myBirthday = '18.04.1982';
        // myBirthday = '01.01.2001'; // error, can't reassign the constant!

    </script>
</body>

</html>
